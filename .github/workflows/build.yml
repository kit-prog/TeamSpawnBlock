name: Build Forge mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Show Gradle version
        run: gradle --version

      - name: Build mod (retry on temporary Maven timeouts)
        working-directory: TeamSpawnBlock-Forge-1.20.1-source/TeamSpawnBlock
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if gradle build --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          echo "Build failed after 3 attempts."
          exit 1

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TeamSpawnBlock-Forge-1.20.1
          path: TeamSpawnBlock-Forge-1.20.1-source/TeamSpawnBlock/build/libs/*.jar
          if-no-files-found: error

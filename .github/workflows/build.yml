name: Build Forge mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        working-directory: TeamSpawnBlock-Forge-1.20.1-source/TeamSpawnBlock
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TeamSpawnBlock-Forge-1.20.1
          path: TeamSpawnBlock-Forge-1.20.1-source/TeamSpawnBlock/build/libs/*.jar
          if-no-files-found: error
